name: Package Watch the Skies

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCHIVE_NAME: Watch_the_Skies_${{ github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full gh

      - name: Build Archive
        run: |
          set -euxo pipefail

          echo "Building archive..."
          7z a "${ARCHIVE_NAME}.7z" . \
            -xr!.git \
            -xr!.github \
            -xr!README.md \
            -xr!.gitignore

          echo "Verifying archive..."
          ls -lah
          test -f "${ARCHIVE_NAME}.7z"

      - name: Generate Changelog
        run: |
          set -euxo pipefail

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)")
          else
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)")
          fi

          {
            echo "CHANGELOG<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Debug GH + context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          echo "Repo: $GITHUB_REPOSITORY"
          gh auth status || true
          gh repo view "$GITHUB_REPOSITORY" || true

      - name: Create Release (DEBUG MODE)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          echo "Final check:"
          ls -lah "${ARCHIVE_NAME}.7z"

          gh release create "${{ github.ref_name }}" \
            "${ARCHIVE_NAME}.7z" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ github.ref_name }}" \
            --notes "## Changelog${CHANGELOG}"